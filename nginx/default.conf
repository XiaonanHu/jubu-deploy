server {
    listen 443 ssl;
    server_name api.buju.ai;
    ssl_certificate /etc/letsencrypt/live/api.buju.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.buju.ai/privkey.pem;
    location / {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name app.buju.ai;
    ssl_certificate /etc/letsencrypt/live/app.buju.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.buju.ai/privkey.pem;

    # SSE streaming — disable buffering so tokens reach the client immediately
    location ~ ^/parent/chat/sessions/[^/]+/messages$ {
        proxy_pass http://parent-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://parent-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name lk.buju.ai;
    ssl_certificate /etc/letsencrypt/live/lk.buju.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.buju.ai/privkey.pem;
    location / {
        proxy_pass http://livekit:7880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# stats.buju.ai SSL block.
# PREREQUISITE: the cert must exist before nginx loads this block, or nginx
# will fail to start. Issue it first (port 80 ACME route below already works):
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d stats.buju.ai --email xia@buju.ai --agree-tos --non-interactive
server {
    listen 443 ssl;
    server_name stats.buju.ai;
    ssl_certificate /etc/letsencrypt/live/stats.buju.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.buju.ai/privkey.pem;
    auth_basic "Buju Stats";
    auth_basic_user_file /etc/nginx/htpasswd;
    location /stream/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
    location /viewer/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name api.buju.ai app.buju.ai lk.buju.ai stats.buju.ai;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
